<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Realtime Model Share</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="c"></canvas>

    <div id="ui-container">
        <div class="top-left">
            <div id="user-list"></div>
        </div>
        <div class="bottom-center">
             <label for="upload-input" class="upload-button">
                Upload Model
            </label>
            <input type="file" id="upload-input" accept=".glb,.gltf" style="display: none;">
            <button id="download-button" class="upload-button hidden">Download Selected</button>
        </div>
    </div>

    <div id="loader" class="hidden">
        <div class="spinner"></div>
        <p>Processing model...</p>
    </div>

    <script type="module" src="main.js"></script>
